# Informacion general del proyecto
spring.application.name=proyecto1
app.info.name=Gestor de Inventario
app.info.version=@project.version@
app.info.description=API del Gestor de Inventario.
app.info.environment=default
app.info.developer.name=Jefferson
app.info.developer.email=jef@gmail.com
app.info.developer.role=Desarrollador

# Categoria 1: servidor (3 datos)
server.port=8081
project.configuration.server.port=${server.port}
project.configuration.server.framework=Spring Boot
project.configuration.server.context-path=/

# Categoria 2: logging (3 datos)
logging.level.root=INFO
project.configuration.logging.level=${logging.level.root}
project.configuration.logging.file=Consola
project.configuration.logging.format=Texto

# Categoria 3: base de datos (3 datos)
project.configuration.database.engine=H2
project.configuration.database.mode=Base de datos embebida
project.configuration.database.driver=org.h2.Driver

# Categoria 4: seguridad (3 datos)
spring.security.user.name=jef
spring.security.user.password=jef123
spring.security.user.roles=USER
project.configuration.security.status=Autenticacion activa
project.configuration.security.credentials=Usuario: jef; rol: USER
project.configuration.security.authentication=HTTP Basic

# Categoria 5: actuador (3 datos)
project.configuration.actuator.status=Habilitado
project.configuration.actuator.details=Endpoints HTTP: health, info, configprops
project.configuration.actuator.endpoint=/actuator/health

# Configuracion funcional de Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,configprops
management.endpoint.health.show-details=never
management.endpoint.configprops.show-values=when-authorized
management.info.env.enabled=true
info.app.name=${app.info.name}
info.app.version=${app.info.version}
info.app.description=${app.info.description}
